<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScammerTrapper - Hitelesítés</title>
  
  <!-- Google reCAPTCHA Enterprise Script -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdAe6ctAAAAAD11xedgohduSYaJVcpNEmLbMNSs"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 1.5rem; }
    
    /* Fülek (Tabs) */
    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #334155; }
    .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #94a3b8; font-weight: bold; transition: 0.2s; }
    .tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; margin-bottom: -2px; }

    .input-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #94a3b8; }
    input { width: 100%; padding: 0.7rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    input:focus { border-color: #38bdf8; }

    button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 0.5rem; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-google { background: #ea4335; color: white; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-google:hover { background: #dc2626; }

    .divider { text-align: center; margin: 1.2rem 0; color: #64748b; font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #334155; }
    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .form-section { display: none; }
    .form-section.active { display: block; }
    #status { margin-top: 1rem; text-align: center; font-size: 0.85rem; color: #f43f5e; }
    
    /* reCAPTCHA jelvény finomítása */
    .grecaptcha-badge { z-index: 999; }
  </style>
</head>
<body>

  <div class="card">
    <h2>ScammerTrapper</h2>

    <!-- Fülek a váltáshoz -->
    <div class="tabs">
      <div class="tab active" id="tabLogin">Bejelentkezés</div>
      <div class="tab" id="tabRegister">Regisztráció</div>
    </div>

    <!-- BEJELENTKEZÉSI ŰRLAP -->
    <div class="form-section active" id="loginSection">
      <div class="input-group">
        <label>Email cím</label>
        <input type="email" id="loginEmail" placeholder="example@domain.com">
      </div>
      <div class="input-group">
        <label>Jelszó</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <button class="btn-primary" id="loginBtn">Bejelentkezés</button>
    </div>

    <!-- REGISZTRÁCIÓS ŰRLAP -->
    <div class="form-section" id="registerSection">
      <div class="input-group">
        <label>Teljes Név</label>
        <input type="text" id="regName" placeholder="Gipsz Jakab">
      </div>
      <div class="input-group">
        <label>Felhasználónév</label>
        <input type="text" id="regUsername" placeholder="jakab99">
      </div>
      <div class="input-group">
        <label>Email cím</label>
        <input type="email" id="regEmail" placeholder="example@domain.com">
      </div>
      <div class="input-group">
        <label>Jelszó</label>
        <input type="password" id="regPassword1" placeholder="••••••••">
      </div>
      <div class="input-group">
        <label>Jelszó még egyszer</label>
        <input type="password" id="regPassword2" placeholder="••••••••">
      </div>
      <button class="btn-primary" id="registerBtn">Regisztráció</button>
    </div>

    <!-- GOOGLE BELÉPÉS -->
    <div class="divider">VAGY</div>
    <button class="btn-google" id="googleBtn">
      Bejelentkezés Google-fiókkal
    </button>

    <p id="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACpOJUxF6rzqrhqeiQl2BY575CdrDmHN0",
      authDomain: "scammertrapper-a4755.firebaseapp.com",
      projectId: "scammertrapper-a4755",
      storageBucket: "scammertrapper-a4755.firebasestorage.app",
      messagingSenderId: "639832220374",
      appId: "1:639832220374:web:ae4e1942130ff40344df77",
      measurementId: "G-SQM1PTX2LR"
    };

    const RECAPTCHA_SITE_KEY = "6LdAe6ctAAAAAD11xedgohduSYaJVcpNEmLbMNSs";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const status = document.getElementById("status");

    // Fülek közötti váltás logika
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginSection = document.getElementById("loginSection");
    const registerSection = document.getElementById("registerSection");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginSection.classList.add("active");
      registerSection.classList.remove("active");
      status.innerText = "";
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      registerSection.classList.add("active");
      loginSection.classList.remove("active");
      status.innerText = "";
    });

    // reCAPTCHA Token beszerzése segédfüggvény
    async function getRecaptchaToken(actionName) {
      return new Promise((resolve, reject) => {
        grecaptcha.enterprise.ready(async () => {
          try {
            const token = await grecaptcha.enterprise.execute(RECAPTCHA_SITE_KEY, { action: actionName });
            resolve(token);
          } catch (err) {
            reject(err);
          }
        });
      });
    }

    // 1. BEJELENTKEZÉS (reCAPTCHA v3/Enterprise-al)
    document.getElementById("loginBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        status.innerText = "Kérlek add meg az emailt és a jelszót!";
        return;
      }

      try {
        status.innerText = "Ellenőrzés...";
        // reCAPTCHA Enterprise ellenőrzés
        const recaptchaToken = await getRecaptchaToken('LOGIN');
        console.log("reCAPTCHA LOGIN Token:", recaptchaToken);

        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "chat.html";
      } catch (err) {
        status.innerText = "Hibás email vagy jelszó!";
      }
    });

    // 2. REGISZTRÁCIÓ (reCAPTCHA v3/Enterprise-al)
    document.getElementById("registerBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass1 = document.getElementById("regPassword1").value;
      const pass2 = document.getElementById("regPassword2").value;

      if (!name || !username || !email || !pass1 || !pass2) {
        status.innerText = "Kérlek töltsd ki az összes mezőt!";
        return;
      }

      if (pass1 !== pass2) {
        status.innerText = "A két jelszó nem egyezik meg!";
        return;
      }

      try {
        status.innerText = "Ellenőrzés...";
        // reCAPTCHA Enterprise ellenőrzés
        const recaptchaToken = await getRecaptchaToken('REGISTER');
        console.log("reCAPTCHA REGISTER Token:", recaptchaToken);

        const userCred = await createUserWithEmailAndPassword(auth, email, pass1);
        
        // Adatok elmentése Firestore-ba scammerTrapper ranggal
        await setDoc(doc(db, "users", userCred.user.uid), {
          uid: userCred.user.uid,
          name: name,
          username: username,
          email: email,
          role: "scammerTrapper",
          createdAt: new Date()
        });

        window.location.href = "chat.html";
      } catch (err) {
        status.innerText = "Hiba: " + err.message;
      }
    });

    // 3. GOOGLE BEJELENTKEZÉS
    document.getElementById("googleBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        const recaptchaToken = await getRecaptchaToken('GOOGLE_LOGIN');
        console.log("reCAPTCHA GOOGLE Token:", recaptchaToken);

        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists() && userSnap.data().username) {
          window.location.href = "chat.html";
        } else {
          window.location.href = "google-more.html";
        }
      } catch (err) {
        status.innerText = "Google belépési hiba: " + err.message;
      }
    });
  </script>
</body>
</html>

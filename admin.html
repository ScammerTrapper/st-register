<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScammerTrapper - Admin Felület</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    
    /* Alapértelmezetten elrejtjük az egész oldalt, amíg a jogosultság ellenőrzése tart */
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: none; /* Ellenőrzésig rejtve */
    }

    /* Betöltő képernyő, amíg a jogosultságot ellenőrizzük */
    #authCheckLoader {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid #f43f5e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Admin felület stílusai */
    .admin-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
    .header h1 { color: #f43f5e; }
    
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .card h2 { color: #38bdf8; margin-bottom: 1rem; font-size: 1.2rem; }

    button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-danger { background: #f43f5e; color: white; }
    .btn-danger:hover { background: #e11d48; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }

    .input-group { display: flex; gap: 10px; margin-top: 1rem; }
    .input-group input { flex: 1; padding: 0.7rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
  </style>
</head>
<body>

  <!-- Betöltő képernyő (amíg az admin rangot ellenőrizzük) -->
  <div id="authCheckLoader">
    <div class="spinner"></div>
    <p>Adminisztrátori jogosultság ellenőrzése...</p>
  </div>

  <!-- A tényleges admin felület -->
  <div class="admin-container">
    <div class="header">
      <h1>Admin Vezérlőpult</h1>
      <button class="btn-danger" id="logoutBtn">Kijelentkezés</button>
    </div>

    <!-- Példa Admin funkció: Új chatszoba / kód generálása -->
    <div class="card">
      <h2>Új Csevegőszoba Létrehozása</h2>
      <p style="color: #94a3b8; font-size: 0.9rem;">Hozz létre egy új szobát és generálj hozzá kódot a felhasználóknak.</p>
      <div class="input-group">
        <input type="text" id="newRoomCode" placeholder="Szobakód (pl. ADMIN101)">
        <button class="btn-primary" id="createRoomBtn">Szoba Létrehozása</button>
      </div>
      <p id="adminStatus" style="margin-top: 0.5rem; font-size: 0.85rem; color: #38bdf8;"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACpOJUxF6rzqrhqeiQl2BY575CdrDmHN0",
      authDomain: "scammertrapper-a4755.firebaseapp.com",
      projectId: "scammertrapper-a4755",
      storageBucket: "scammertrapper-a4755.firebasestorage.app",
      messagingSenderId: "639832220374",
      appId: "1:639832220374:web:ae4e1942130ff40344df77",
      measurementId: "G-SQM1PTX2LR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 🔒 JOGOSULTSÁG ELLENŐRZÉSE (SECURITY GUARD)
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // 1. Ha nincs bejelentkezve -> Vissza az Auth oldalra
        window.location.href = "auth.html";
        return;
      }

      try {
        // Lekérjük a felhasználó adatát a Firestore 'users' gyűjteményből
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const userData = userSnap.data();

          // 2. Ellenőrizzük, hogy a role megegyezik-e az 'admin'-nal
          if (userData.role === "admin") {
            // SIKER: Admin a felhasználó! Megjelenítjük az oldalt.
            document.getElementById("authCheckLoader").style.display = "none";
            document.body.style.display = "block";
          } else {
            // 3. Ha csak 'scammerTrapper' vagy egyéb nem-admin user -> Kidobjuk az Auth-ra!
            window.location.href = "auth.html";
          }
        } else {
          // Ha nincs Firestore rekordja -> Kidobjuk az Auth-ra
          window.location.href = "auth.html";
        }
      } catch (err) {
        console.error("Hiba az ellenőrzés során:", err);
        window.location.href = "auth.html";
      }
    });

    // Új szoba létrehozása (Admin funkció)
    document.getElementById("createRoomBtn").addEventListener("click", async () => {
      const codeInput = document.getElementById("newRoomCode");
      const code = codeInput.value.trim().toUpperCase();
      const status = document.getElementById("adminStatus");

      if (!code) {
        status.innerText = "Adja meg a szobakódot!";
        return;
      }

      try {
        await setDoc(doc(db, "rooms", code), {
          code: code,
          createdAt: serverTimestamp()
        });
        status.innerText = `Sikeresen létrehozva a(z) ${code} szoba!`;
        codeInput.value = "";
      } catch (err) {
        status.innerText = "Hiba a létrehozáskor: " + err.message;
      }
    });

    // Kijelentkezés
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => {
        window.location.href = "auth.html";
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScammerTrapper - Csevegés</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    .chat-container { width: 95%; max-width: 900px; height: 85vh; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .chat-header { background: #0f172a; padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .chat-header h2 { font-size: 1.1rem; }
    
    .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { background: #334155; padding: 0.75rem 1rem; border-radius: 8px; max-width: 75%; word-wrap: break-word; align-self: flex-start; }
    .message.own { background: #0369a1; align-self: flex-end; }
    
    .message .sender { font-size: 0.8rem; color: #38bdf8; font-weight: bold; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 6px; }
    .message.own .sender { color: #7dd3fc; }
    .message .role { font-size: 0.65rem; background: #0284c7; padding: 1px 6px; border-radius: 4px; color: white; text-transform: uppercase; }

    .chat-input { display: flex; padding: 1rem; background: #0f172a; gap: 10px; border-top: 1px solid #334155; }
    .chat-input input { flex: 1; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }

    button { padding: 0.75rem 1.2rem; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    .btn-back { background: #334155; }
    .btn-back:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <button class="btn-back" id="backBtn">← Vissza a Dashboardra</button>
      <h2>Szoba: <strong id="currentRoom" style="color: #38bdf8;">-</strong></h2>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Írj egy üzenetet...">
      <button id="sendBtn">Küldés</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACpOJUxF6rzqrhqeiQl2BY575CdrDmHN0",
      authDomain: "scammertrapper-a4755.firebaseapp.com",
      projectId: "scammertrapper-a4755",
      storageBucket: "scammertrapper-a4755.firebasestorage.app",
      messagingSenderId: "639832220374",
      appId: "1:639832220374:web:ae4e1942130ff40344df77",
      measurementId: "G-SQM1PTX2LR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserData = null;

    // URL Paraméter kiolvasása (?kod=A1B2C3)
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('kod');

    if (!roomCode) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("currentRoom").innerText = roomCode;

    // Vissza gomb
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "dashboard.html";
    });

    // Felhasználó és jogosultság ellenőrzése
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if (userSnap.exists()) {
          currentUserData = userSnap.data();
        }
        initChat(roomCode);
      }
    });

    // Chat inicializálása és üzenetek figyelése
    function initChat(code) {
      const q = query(collection(db, "rooms", code, "messages"), orderBy("timestamp", "asc"));
      
      onSnapshot(q, (snapshot) => {
        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const isOwn = currentUserData && msg.senderEmail === currentUserData.email;

          const msgEl = document.createElement("div");
          msgEl.className = `message ${isOwn ? 'own' : ''}`;
          msgEl.innerHTML = `
            <div class="sender">
              ${msg.senderName || msg.senderEmail} 
              <span class="role">${msg.role || 'user'}</span>
            </div>
            <div>${msg.text}</div>
          `;
          messagesDiv.appendChild(msgEl);
        });

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // Üzenet küldése
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text || !roomCode || !currentUserData) return;

      await addDoc(collection(db, "rooms", roomCode, "messages"), {
        senderName: currentUserData.name || currentUserData.username,
        senderEmail: currentUserData.email,
        role: currentUserData.role || "user",
        text: text,
        timestamp: serverTimestamp()
      });

      input.value = "";
    }
  </script>
</body>
</html>

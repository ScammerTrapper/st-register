<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScammerTrapper - Betöltés...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex-direction: column; 
    }

    .loader-container {
      text-align: center;
    }

    /* Modern forgó tölcsér / spinner */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h2 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner"></div>
    <h2>ScammerTrapper</h2>
    <p>Azonosítás folyamatban...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACpOJUxF6rzqrhqeiQl2BY575CdrDmHN0",
      authDomain: "scammertrapper-a4755.firebaseapp.com",
      projectId: "scammertrapper-a4755",
      storageBucket: "scammertrapper-a4755.firebasestorage.app",
      messagingSenderId: "639832220374",
      appId: "1:639832220374:web:ae4e1942130ff40344df77",
      measurementId: "G-SQM1PTX2LR"
    };

    // Firebase inicializálása
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Bejelentkezési állapot ellenőrzése
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Ha be van jelentkezve -> Dashboard
        window.location.href = "dashboard.html";
      } else {
        // Ha nincs bejelentkezve -> Auth oldal
        window.location.href = "auth.html";
      }
    });
  </script>
</body>
</html>
